name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend_build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend_tests_optional:
    name: Backend - Install (Tests only if present)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (only if test files exist)
        shell: bash
        run: |
          set -e
          if find . -type f \( -name "*.test.js" -o -name "*.spec.js" -o -name "*.test.ts" -o -name "*.spec.ts" \) | grep -q .; then
            echo "Tests found. Running Jest..."
            npm test -- --ci
          else
            echo "No test files found. Skipping backend tests."
          fi

  smart_contract_compile:
    name: Smart Contracts - Compile PyTeal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart_contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pyteal

      - name: Compile contracts
        run: python algomint_contract.py

      - name: Verify TEAL artifacts exist
        shell: bash
        run: |
          test -f approval.teal
          test -f clear.teal
          echo "TEAL artifacts present."

      - name: Upload TEAL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teal-artifacts
          path: |
            smart_contracts/approval.teal
            smart_contracts/clear.teal
